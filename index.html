<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyrus L Coulter | Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0a0a0a; color: #ededed; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            grid-auto-rows: 150px;
            gap: 1rem;
            padding-bottom: 120px;
        }
        .tile {
            background: #161616;
            border: 1px solid #262626;
            border-radius: 1.5rem;
            padding: 1.5rem;
            position: relative;
            display: flex;
            flex-direction: column;
            transition: border 0.2s, transform 0.1s;
        }
        .tile-edit-mode { border: 1px dashed #60a5fa; cursor: move; }
        .resizer {
            width: 15px; height: 15px;
            background: #60a5fa;
            position: absolute; right: 10px; bottom: 10px;
            cursor: nwse-resize; border-radius: 2px; display: none;
        }
        .tile-edit-mode .resizer { display: block; }
        .edit-controls {
            position: fixed; bottom: 2rem; left: 2rem;
            display: flex; gap: 0.75rem; align-items: center; z-index: 50;
        }
        [contenteditable]:focus { outline: none; border-bottom: 1px solid #60a5fa; }
    </style>
</head>
<body class="p-6 md:p-12">

    <header class="max-w-6xl mx-auto mb-8">
        <h1 class="text-4xl font-bold tracking-tight">Cyrus L Coulter</h1>
        <p class="text-zinc-500 mt-2">Personal Dashboard</p>
    </header>

    <div id="grid" class="max-w-6xl mx-auto grid-container"></div>

    <div class="edit-controls">
        <button onclick="handleEditClick()" id="editBtn" class="bg-zinc-800 hover:bg-zinc-700 px-6 py-3 rounded-full text-zinc-400 text-sm font-medium transition shadow-lg">
            Edit Layout
        </button>
        <button onclick="addTile()" id="addBtn" class="hidden bg-blue-600 hover:bg-blue-500 px-5 py-3 rounded-full text-white text-sm font-medium transition shadow-lg">
            + Tile
        </button>
        <button onclick="revertChanges()" id="revertBtn" class="hidden bg-red-900/50 hover:bg-red-800 px-5 py-3 rounded-full text-red-200 text-sm font-medium transition shadow-lg border border-red-500/50">
            Revert
        </button>
    </div>

    <script>
        const PASSWORD = "140788";
        let isEditing = false;
        let isAuthenticated = false;
        
        // This holds the "working copy"
        let tiles = [];
        // This holds the "last saved" version for reverting
        let backupTiles = [];

        // Initial Load
        window.onload = () => {
            const saved = localStorage.getItem('cyrus_tiles');
            if (saved) {
                tiles = JSON.parse(saved);
            } else {
                tiles = [
                    { id: 1, title: 'Banking', content: 'Financial Center Consultant II', w: 1, h: 1, color: 'text-emerald-400' },
                    { id: 2, title: 'System Specs', content: 'i7-14700K | RTX 4070 Ti Super', w: 2, h: 1, color: 'text-blue-400' },
                    { id: 3, title: 'Current Focus', content: 'Optimizing Minecraft 1.21.11 and Baritone.', w: 3, h: 1, color: 'text-orange-400' }
                ];
            }
            renderTiles();
        };

        function renderTiles() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            tiles.forEach(tile => {
                const el = document.createElement('div');
                el.className = `tile ${isEditing ? 'tile-edit-mode' : ''}`;
                el.style.gridColumn = `span ${tile.w}`;
                el.style.gridRow = `span ${tile.h}`;
                
                el.innerHTML = `
                    <h2 class="text-lg font-semibold ${tile.color} mb-1" 
                        contenteditable="${isEditing}" oninput="updateTile(${tile.id}, 'title', this.innerText)">${tile.title}</h2>
                    <p class="text-zinc-400 text-sm overflow-hidden" 
                        contenteditable="${isEditing}" oninput="updateTile(${tile.id}, 'content', this.innerText)">${tile.content}</p>
                    <div class="resizer" onmousedown="initResize(event, ${tile.id})"></div>
                    ${isEditing ? `<button onclick="deleteTile(${tile.id})" class="absolute top-2 right-2 text-zinc-600 hover:text-red-500 text-xs">✕</button>` : ''}
                `;
                grid.appendChild(el);
            });
        }

        function handleEditClick() {
            if (!isEditing) {
                if (isAuthenticated || prompt("Enter password:") === PASSWORD) {
                    isAuthenticated = true;
                    // Create a deep copy backup before editing
                    backupTiles = JSON.parse(JSON.stringify(tiles));
                    
                    isEditing = true;
                    updateUI(true);
                    renderTiles();
                } else { alert("Wrong password."); }
            } else {
                // Save finalized state
                isEditing = false;
                localStorage.setItem('cyrus_tiles', JSON.stringify(tiles));
                updateUI(false);
                renderTiles();
            }
        }

        function revertChanges() {
            if (confirm("Discard all unsaved changes?")) {
                tiles = JSON.parse(JSON.stringify(backupTiles));
                isEditing = false;
                updateUI(false);
                renderTiles();
            }
        }

        function updateUI(editMode) {
            const btn = document.getElementById('editBtn');
            btn.innerText = editMode ? "Finish & Save" : "Edit Layout";
            btn.className = editMode ? 
                "bg-emerald-600 hover:bg-emerald-500 px-6 py-3 rounded-full text-white text-sm font-medium transition shadow-lg" : 
                "bg-zinc-800 hover:bg-zinc-700 px-6 py-3 rounded-full text-zinc-400 text-sm font-medium transition shadow-lg";
            
            document.getElementById('addBtn').classList.toggle('hidden', !editMode);
            document.getElementById('revertBtn').classList.toggle('hidden', !editMode);
        }

        function updateTile(id, field, value) {
            const tile = tiles.find(t => t.id === id);
            if (tile) tile[field] = value;
        }

        function addTile() {
            const newId = Date.now();
            tiles.push({ id: newId, title: 'New Tile', content: 'New Content', w: 1, h: 1, color: 'text-zinc-400' });
            renderTiles();
        }

        function deleteTile(id) {
            tiles = tiles.filter(t => t.id !== id);
            renderTiles();
        }

        function initResize(e, id) {
            e.preventDefault();
            const tile = tiles.find(t => t.id === id);
            const startX = e.clientX;
            const startY = e.clientY;
            const startW = tile.w;
            const startH = tile.h;

            function doResize(moveEvent) {
                const diffX = moveEvent.clientX - startX;
                const diffY = moveEvent.clientY - startY;
                tile.w = Math.max(1, startW + Math.round(diffX / 160));
                tile.h = Math.max(1, startH + Math.round(diffY / 160));
                renderTiles();
            }

            function stopResize() {
                window.removeEventListener('mousemove', doResize);
                window.removeEventListener('mouseup', stopResize);
            }

            window.addEventListener('mousemove', doResize);
            window.addEventListener('mouseup', stopResize);
        }
    </script>
</body>
</html>
