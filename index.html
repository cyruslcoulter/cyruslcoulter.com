<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyrus L Coulter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0a0a0a; color: #ededed; font-family: 'Inter', sans-serif; }
        .bento-card { background: #161616; border: 1px solid #262626; border-radius: 1.5rem; padding: 1.5rem; transition: border 0.3s; }
        .bento-card:hover { border-color: #3f3f46; }
        .edit-input { background: #262626; border: 1px solid #3f3f46; border-radius: 0.5rem; padding: 0.2rem 0.5rem; width: 100%; color: #60a5fa; outline: none; }
        .edit-input:focus { border-color: #60a5fa; }
        .hidden { display: none; }
    </style>
</head>
<body class="p-6 md:p-12">

    <header class="max-w-5xl mx-auto mb-12 flex justify-between items-end">
        <div>
            <h1 class="text-4xl font-bold tracking-tight">Cyrus L Coulter</h1>
            <p class="text-zinc-500 mt-2">Personal Dashboard</p>
        </div>
        <button onclick="handleEditClick()" id="editBtn" class="text-xs bg-zinc-800 hover:bg-zinc-700 px-4 py-2 rounded-full text-zinc-400 transition">
            Edit Page
        </button>
    </header>

    <main class="max-w-5xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-4">
        <div class="bento-card">
            <h2 class="text-xl font-semibold text-emerald-400 mb-2">Banking</h2>
            <p class="view-field text-zinc-300" id="work-view">Financial Center Consultant II</p>
            <input class="edit-input hidden" id="work-edit" value="Financial Center Consultant II">
        </div>

        <div class="bento-card md:col-span-2">
            <h2 class="text-xl font-semibold text-blue-400 mb-2">System Specs</h2>
            <p class="view-field text-zinc-300" id="specs-view">i7-14700K | RTX 4070 Ti Super | 32GB RAM</p>
            <input class="edit-input hidden" id="specs-edit" value="i7-14700K | RTX 4070 Ti Super | 32GB RAM">
        </div>

        <div class="bento-card md:col-span-3">
            <h2 class="text-xl font-semibold text-orange-400 mb-2">Current Project</h2>
            <p class="view-field text-zinc-300" id="focus-view">Optimizing Minecraft Java 1.21.11 farms and Baritone pathfinding.</p>
            <textarea class="edit-input hidden h-20" id="focus-edit">Optimizing Minecraft Java 1.21.11 farms and Baritone pathfinding.</textarea>
        </div>
    </main>

    <script>
        const PASSWORD = "140788"; 
        let isEditing = false;
        let isAuthenticated = false;

        // Load data from storage on startup
        window.onload = () => {
            const fields = ['work', 'specs', 'focus'];
            fields.forEach(f => {
                const saved = localStorage.getItem(f);
                if (saved) {
                    document.getElementById(`${f}-view`).innerText = saved;
                    document.getElementById(`${f}-edit`).value = saved;
                }
            });
        };

        function handleEditClick() {
            if (!isEditing) {
                // If already authenticated this session, just open. Otherwise, ask.
                if (isAuthenticated) {
                    toggleUI(true);
                } else {
                    const attempt = prompt("Enter password to unlock fields:");
                    if (attempt === PASSWORD) {
                        isAuthenticated = true;
                        toggleUI(true);
                    } else {
                        alert("Wrong password.");
                    }
                }
            } else {
                saveData();
                toggleUI(false);
            }
        }

        function toggleUI(editMode) {
            isEditing = editMode;
            const btn = document.getElementById('editBtn');
            const views = document.querySelectorAll('.view-field');
            const inputs = document.querySelectorAll('.edit-input');

            btn.innerText = editMode ? "Save Changes" : "Edit Page";
            btn.className = editMode ? 
                "text-xs bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded-full text-white transition" : 
                "text-xs bg-zinc-800 hover:bg-zinc-700 px-4 py-2 rounded-full text-zinc-400 transition";

            views.forEach(v => v.classList.toggle('hidden', editMode));
            inputs.forEach(i => i.classList.toggle('hidden', !editMode));
        }

        function saveData() {
            const fields = ['work', 'specs', 'focus'];
            fields.forEach(f => {
                const val = document.getElementById(`${f}-edit`).value;
                document.getElementById(`${f}-view`).innerText = val;
                localStorage.setItem(f, val); 
            });
        }
    </script>
</body>
</html>
